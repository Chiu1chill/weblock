<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Weblock</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body class="popup-page">
    <main id="popup-view" class="popup-shell">
      <header class="brand-row">
        <div class="brand-mark" aria-hidden="true">W</div>
        <div>
          <p class="eyebrow">BROWSER CONTROL</p>
          <h1>Weblock</h1>
        </div>
        <span class="duration-tag">12 小時</span>
      </header>

      <section class="current-site" aria-live="polite">
        <span class="section-label">目前網站</span>
        <strong id="current-host">讀取中…</strong>
        <p id="site-state" class="site-state"></p>
      </section>

      <form id="lock-form" class="lock-form">
        <p class="fixed-password-note">鎖定網站時會使用固定密碼。</p>
        <button id="lock-button" class="primary-button" type="submit">鎖定此網站</button>
      </form>

      <p id="message" class="message" role="status" aria-live="polite"></p>

      <section class="locks-section">
        <div class="list-heading">
          <h2>鎖定中的網站</h2>
          <span id="lock-count" class="count">0</span>
        </div>
        <ul id="lock-list" class="lock-list"></ul>
        <p id="empty-state" class="empty-state">目前沒有鎖定的網站</p>
      </section>
      <footer>密碼以加鹽雜湊方式儲存</footer>
    </main>

    <main id="gate-view" class="gate-shell" hidden>
      <div class="gate-topline">
        <div class="brand-mark" aria-hidden="true">W</div>
        <span>WEBLOCK / ACCESS GATE</span>
      </div>
      <div class="gate-content">
        <p class="eyebrow">PRIVATE BROWSING</p>
        <h1>這個網站<br>目前已鎖定。</h1>
        <p id="target-host" class="target-host">正在確認網站…</p>
        <form id="unlock-form" class="unlock-form" hidden>
          <label for="unlock-password">輸入網站密碼</label>
          <p class="fixed-password-note">固定密碼：<code id="fixed-password"></code></p>
          <div class="password-row">
            <input id="unlock-password" type="password" autocomplete="off" required autofocus>
            <button type="submit" class="unlock-button" aria-label="驗證密碼" title="驗證密碼">→</button>
          </div>
          <p id="error-message" class="error-message" role="alert" aria-live="polite"></p>
        </form>
        <p class="expiry-note"><span class="expiry-dot"></span>此鎖定將於 12 小時後自動解除</p>
      </div>
      <footer class="gate-footer">WEBLOCK <span>KEEP YOUR ATTENTION YOURS</span></footer>
    </main>
    <script src="password.js"></script>
    <script src="app.js"></script>
  </body>
</html>
